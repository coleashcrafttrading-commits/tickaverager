<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TickAverager — Fleet</title>
<style>
  :root{
    --bg:#080b11; --bg2:#0c1016; --panel:#141a24; --panel2:#1b2331; --line:#26303f;
    --line2:#334154; --txt:#e6edf5; --dim:#8695a8; --dim2:#5d6c80; --accent:#4da3ff;
    --green:#31d07b; --red:#ff5f6d; --gold:#ffc247; --purple:#b07cff; --teal:#3ddbd9;
    --sidebar:248px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden}
  a{color:var(--accent);text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#243044;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#31415a}

  /* ============================ shell ============================ */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh}
  aside{background:var(--bg2);border-right:1px solid var(--line);display:flex;
        flex-direction:column;min-height:0}
  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .scroll{overflow:auto;flex:1;min-height:0}

  /* ============================ sidebar ============================ */
  .brand{padding:16px 16px 13px;border-bottom:1px solid var(--line)}
  .brand .n{font-size:14px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
  .brand .s{color:var(--dim2);font-size:10px;letter-spacing:.09em;margin-top:3px}
  .navsec{padding:14px 12px 5px;color:var(--dim2);font-size:9.5px;letter-spacing:.16em;
          text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:6px}
  .navsec .c{margin-left:auto;color:var(--dim2);letter-spacing:0}
  .nav{display:block;padding:8px 12px;margin:1px 8px;border-radius:7px;color:var(--dim);
       cursor:pointer;border:1px solid transparent;user-select:none}
  .nav:hover{background:var(--panel);color:var(--txt)}
  .nav.on{background:var(--panel2);color:var(--txt);border-color:var(--line2)}
  .nav.on .navsym{color:#fff}
  .navrow{display:flex;align-items:center;gap:8px}
  .navsym{font-weight:700;letter-spacing:.03em;font-size:13px}
  .navpl{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums}
  .navsub{color:var(--dim2);font-size:10px;margin-top:2px;display:flex;gap:6px;
          align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--dim2)}
  .d-run{background:var(--green);box-shadow:0 0 7px rgba(49,208,123,.85)}
  .d-live{background:var(--red);box-shadow:0 0 7px rgba(255,95,109,.85)}
  .d-halt{background:var(--gold);box-shadow:0 0 7px rgba(255,194,71,.85)}
  .d-off{background:#3a4759}
  .sidefoot{border-top:1px solid var(--line);padding:11px 14px;color:var(--dim2);
            font-size:10px;line-height:1.7}

  /* ============================ topbar ============================ */
  .top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--bg2);
       border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
  .top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.05em}
  .top .sub{color:var(--dim);font-size:11px}
  .spacer{flex:1}
  .kpis{display:flex;gap:18px;align-items:center}
  .kpi .k{color:var(--dim2);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase}
  .kpi .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}

  /* ============================ bits ============================ */
  .pill{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;
        letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;display:inline-block}
  .p-live{background:rgba(255,95,109,.16);color:var(--red);box-shadow:0 0 0 1px rgba(255,95,109,.4) inset}
  .p-dry{background:rgba(77,163,255,.14);color:var(--accent);box-shadow:0 0 0 1px rgba(77,163,255,.35) inset}
  .p-run{background:rgba(49,208,123,.14);color:var(--green);box-shadow:0 0 0 1px rgba(49,208,123,.35) inset}
  .p-off{background:rgba(134,149,168,.12);color:var(--dim);box-shadow:0 0 0 1px rgba(134,149,168,.28) inset}
  .p-halt{background:rgba(255,194,71,.16);color:var(--gold);box-shadow:0 0 0 1px rgba(255,194,71,.45) inset}
  .p-purple{background:rgba(176,124,255,.14);color:var(--purple);box-shadow:0 0 0 1px rgba(176,124,255,.35) inset}

  button{font:inherit;font-weight:600;cursor:pointer;border-radius:7px;padding:7px 13px;
         border:1px solid var(--line2);background:var(--panel2);color:var(--txt);transition:.12s}
  button:hover:not(:disabled){border-color:var(--accent);color:#fff}
  button:disabled{opacity:.32;cursor:not-allowed}
  button.sm{padding:4px 9px;font-size:11px}
  .b-go{background:rgba(49,208,123,.16);border-color:rgba(49,208,123,.45);color:var(--green)}
  .b-arm{background:rgba(255,95,109,.16);border-color:rgba(255,95,109,.45);color:var(--red)}
  .b-warn{background:rgba(255,194,71,.13);border-color:rgba(255,194,71,.4);color:var(--gold)}
  .b-acc{background:rgba(77,163,255,.14);border-color:rgba(77,163,255,.4);color:var(--accent)}

  .wrap{padding:18px 20px 40px;max-width:1500px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         padding:15px;margin-bottom:16px}
  .panel h2{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
            margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:9px}
  .panel h2 .r{margin-left:auto;font-size:10px;letter-spacing:0;text-transform:none;color:var(--dim2)}
  .cols{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
  @media(max-width:1150px){.cols{grid-template-columns:1fr}}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;
         background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .stat{background:var(--panel);padding:10px 12px}
  .stat .k{color:var(--dim);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
  .stat .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
  .stat .sub{color:var(--dim2);font-size:10px;margin-top:2px}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{text-align:right;color:var(--dim);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
     font-weight:700;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:7px 8px;text-align:right;border-bottom:1px solid rgba(38,48,63,.5)}
  tbody tr:hover{background:var(--panel2)}
  tr.clickrow{cursor:pointer}
  .empty{color:var(--dim2);text-align:center;padding:24px;font-style:italic}
  .tblwrap{overflow-x:auto}

  .tabs{display:flex;gap:2px;padding:0 20px;background:var(--bg2);
        border-bottom:1px solid var(--line);flex:none}
  .tab{padding:9px 15px;color:var(--dim);cursor:pointer;font-size:11.5px;font-weight:600;
       letter-spacing:.05em;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--txt)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}

  .form{display:grid;gap:9px}
  .row{display:grid;grid-template-columns:1fr 128px;align-items:center;gap:9px}
  .row label{color:var(--dim);font-size:11px}
  .hint{color:var(--dim2);font-size:10px;margin:-4px 0 3px;line-height:1.55}
  input,select,textarea{font:inherit;background:#080c12;border:1px solid var(--line);
        color:var(--txt);border-radius:6px;padding:5px 8px;width:100%;text-align:right}
  select,textarea{text-align:left}
  textarea{min-height:52px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  fieldset{border:0;padding:0;margin:0 0 15px}
  legend{color:var(--dim);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
         padding:0 0 8px;font-weight:700}
  .search{text-align:left;font-size:15px;padding:10px 12px}

  .banner{border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:12px;line-height:1.62}
  .b-red{background:rgba(255,95,109,.11);border:1px solid rgba(255,95,109,.4)}
  .b-gold{background:rgba(255,194,71,.1);border:1px solid rgba(255,194,71,.38)}
  .b-blue{background:rgba(77,163,255,.09);border:1px solid rgba(77,163,255,.3)}
  .b-green{background:rgba(49,208,123,.09);border:1px solid rgba(49,208,123,.32)}

  .log{height:290px;overflow:auto;font-size:11.5px;line-height:1.6}
  .le{display:flex;gap:8px;padding:2px 0;border-bottom:1px solid rgba(38,48,63,.32)}
  .le .t{color:#54627a;flex:none}
  .le .sy{flex:none;width:44px;color:var(--teal);font-weight:700;font-size:10px}
  .le .lv{flex:none;width:50px;font-weight:700;font-size:10px;letter-spacing:.04em}
  .lv-WIN,.lv-FILL{color:var(--green)} .lv-ERR,.lv-HALT{color:var(--red)}
  .lv-WARN{color:var(--gold)} .lv-DRY{color:var(--purple)}
  .lv-ORDER,.lv-TP{color:var(--accent)} .lv-INFO{color:var(--dim)}

  .pos{color:var(--green)} .neg{color:var(--red)} .dim{color:var(--dim)}
  .dim2{color:var(--dim2)} .gold{color:var(--gold)} .acc{color:var(--accent)}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:11px}
  .ctl{display:flex;gap:8px;flex-wrap:wrap}
  .note{color:var(--dim);font-size:11px;margin-top:10px;line-height:1.62}
  .price{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}

  /* ============================ modal / toast ============================ */
  .veil{position:fixed;inset:0;background:rgba(4,7,11,.76);display:flex;align-items:center;
        justify-content:center;z-index:80;backdrop-filter:blur(2px)}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;
         padding:20px;max-width:520px;width:calc(100% - 40px);
         box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .modal h3{margin:0 0 10px;font-size:14px;letter-spacing:.04em}
  .modal .body{font-size:12px;line-height:1.7;color:#cfdae8}
  .modal .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
  .toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;
          flex-direction:column;gap:8px;max-width:430px}
  .toast{background:var(--panel2);border:1px solid var(--line2);border-left-width:3px;
         border-radius:8px;padding:10px 13px;font-size:11.5px;line-height:1.55;
         box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .18s ease-out}
  .toast.ok{border-left-color:var(--green)} .toast.err{border-left-color:var(--red)}
  .toast.info{border-left-color:var(--accent)}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .srow{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;
        border:1px solid var(--line);background:var(--panel2);margin-bottom:6px;cursor:pointer}
  .srow:hover{border-color:var(--accent)}
  .srow.on{border-color:var(--accent);background:rgba(77,163,255,.09)}
  .srow .sy{font-weight:700;font-size:14px;width:74px;flex:none}
  .srow .nm{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srow .ex{margin-left:auto;color:var(--dim2);font-size:10px;flex:none}

  /* ---------- agent cards ---------- */
  .acard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
         padding:13px;margin-bottom:11px}
  .acard.on{border-color:rgba(49,208,123,.4)}
  .acard.arms{border-color:rgba(255,95,109,.42)}
  .ahead{display:flex;align-items:center;gap:11px;margin-bottom:7px}
  .ahead .t{font-weight:700;font-size:13px}
  .ahead .a{color:var(--dim2);font-size:10px}
  .ablurb{color:var(--dim);font-size:11px;line-height:1.55;margin-bottom:10px}
  .actrl{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .actrl select,.actrl input{width:auto;display:inline-block;padding:4px 7px;font-size:11px}
  .arun{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
        font-size:11px;color:var(--dim)}
  .aout{margin-top:7px;background:#080c12;border:1px solid var(--line);border-radius:6px;
        padding:9px 11px;font-size:11px;line-height:1.6;white-space:pre-wrap;
        max-height:230px;overflow:auto;color:#cfdae8}

  /* the switch */
  .sw{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
  .sw input{position:absolute;opacity:0;width:0;height:0}
  .sw i{position:absolute;inset:0;background:#2a3648;border-radius:22px;transition:.16s;
        display:block}
  .sw i:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
        background:#8695a8;border-radius:50%;transition:.16s}
  .sw input:checked + i{background:rgba(49,208,123,.32)}
  .sw input:checked + i:before{transform:translateX(18px);background:var(--green)}
  .sw.danger input:checked + i{background:rgba(255,95,109,.32)}
  .sw.danger input:checked + i:before{background:var(--red)}
</style>
</head>
<body>

<div class="app">
  <!-- ============================ SIDEBAR ============================ -->
  <aside>
    <div class="brand">
      <div class="n">TickAverager</div>
      <div class="s" id="brandSub">connecting…</div>
    </div>
    <div class="scroll" id="sidenav"></div>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <!-- ============================ MAIN ============================ -->
  <main>
    <div class="top" id="topbar"></div>
    <div class="tabs" id="subtabs" style="display:none"></div>
    <div class="scroll"><div class="wrap" id="view"></div></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>

<script>
"use strict";
/* ================================================================== utils */
const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const money = n => (n < 0 ? "-" : "") + "$" + Math.abs(Number(n)||0)
      .toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => (n < 0 ? "-" : "") + "$" + Math.abs(Number(n)||0)
      .toLocaleString(undefined,{maximumFractionDigits:0});
const sign = n => `<span class="${n>0?'pos':n<0?'neg':'dim'}">${n>0?'+':''}${money(n)}</span>`;
const px = (v,d=2) => v ? "$" + Number(v).toFixed(d) : "—";
const mins = s => s ? (s >= 3600 ? (s/3600).toFixed(1)+"h" : Math.round(s/60)+"m") : "—";
const stat = (k,v,sub) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>`
      + (sub ? `<div class="sub">${sub}</div>` : "") + `</div>`;

async function req(method, path, body){
  const r = await fetch(path, {
    method,
    headers: body ? {"content-type":"application/json"} : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const txt = await r.text();
  if(!r.ok){
    let msg = txt;
    try{ msg = JSON.parse(txt).detail || txt; }catch(e){}
    throw new Error(msg || r.statusText);
  }
  return txt ? JSON.parse(txt) : {};
}
const GET  = p => req("GET", p);
const POST = (p,b={}) => req("POST", p, b);
const DEL  = p => req("DELETE", p);

function toast(msg, kind="info", ms=5200){
  const d = document.createElement("div");
  d.className = "toast " + kind;
  d.innerHTML = msg;
  el("toasts").appendChild(d);
  setTimeout(() => d.remove(), ms);
}

/* confirm dialog. requireWord forces the operator to TYPE it -- used for
   anything that transmits orders or sells stock. */
function ask({title, body, ok="Confirm", danger=false, requireWord="", checkbox=null}){
  return new Promise(resolve => {
    const v = document.createElement("div");
    v.className = "veil";
    v.innerHTML = `<div class="modal">
      <h3>${title}</h3>
      <div class="body">${body}</div>
      ${checkbox ? `<label style="display:flex;gap:9px;align-items:flex-start;margin-top:14px;
          padding:10px 12px;border:1px solid var(--line2);border-radius:8px;cursor:pointer">
        <input type="checkbox" id="mchk" style="width:auto;margin-top:2px"${checkbox.checked?" checked":""}>
        <span style="font-size:11.5px;line-height:1.55">${checkbox.label}</span></label>` : ""}
      ${requireWord ? `<div style="margin-top:14px">
        <label class="dim" style="font-size:11px">Type <b>${requireWord}</b> to confirm</label>
        <input id="mword" style="text-align:left;margin-top:5px" autocomplete="off" spellcheck="false"></div>` : ""}
      <div class="acts">
        <button id="mno">Cancel</button>
        <button id="myes" class="${danger?'b-arm':'b-go'}" ${requireWord?"disabled":""}>${ok}</button>
      </div></div>`;
    document.body.appendChild(v);
    const yes = v.querySelector("#myes"), w = v.querySelector("#mword");
    // the checkbox has to be read BEFORE the veil is torn out of the DOM
    const done = r => {
      const chk = v.querySelector("#mchk");
      const val = (r && checkbox) ? {checked: !!(chk && chk.checked)} : r;
      v.remove();
      resolve(val);
    };
    if(w){
      w.focus();
      w.addEventListener("input", () => { yes.disabled = w.value.trim().toUpperCase() !== requireWord; });
      w.addEventListener("keydown", e => { if(e.key === "Enter" && !yes.disabled) done(true); });
    } else yes.focus();
    yes.onclick = () => done(true);
    v.querySelector("#mno").onclick = () => done(false);
    v.addEventListener("click", e => { if(e.target === v) done(false); });
    document.addEventListener("keydown", function k(e){
      if(e.key === "Escape"){ document.removeEventListener("keydown", k); done(false); }
    });
  });
}

/* ------------------------------- restart -------------------------------
   The server exits with a code start_bot.bat relaunches on. The page then
   waits for the new process to answer and reloads itself, so the operator
   never has to touch the console window. */
async function doRestart(){
  const ov = S.ov;
  if(ov && ov.supervised === false){
    await ask({title:"Restart isn't available here", ok:"OK",
      body:"This server wasn't launched by <code>start_bot.bat</code>, so nothing would "
         + "bring it back up after it exits.<br><br>Close the console window and start it "
         + "again with <b>start_bot.bat</b> — the button works from then on."});
    return;
  }
  const running = (ov ? ov.tickers.filter(t => t.running) : []);
  const armed = running.filter(t => !t.dry_run).map(t => t.symbol);
  const list = running.map(t => t.symbol);

  const r = await ask({
    title:"Restart the dashboard?", ok:"Restart", danger:true,
    body:`The server stops and relaunches — that is how new code and new settings
      get picked up.<br><br>
      <b>Take-profits resting at Alpaca stay live the whole time.</b> They are the
      broker's orders, not this process's, so nothing stops protecting your position.<br><br>
      ${list.length ? `Running now: <b>${list.join(", ")}</b>.
         ${armed.length ? `<span class="neg">${armed.join(", ")} ${armed.length>1?"are":"is"} ARMED.</span>` : ""}
         While the server is down those ladders are not looking for entries.`
       : `No engines are running, so nothing is interrupted.`}`,
    checkbox: list.length ? {
      checked: false,
      label: `Start ${list.join(", ")} again automatically once it's back.`
           + (armed.length ? ` <b class="neg">${armed.join(", ")} would resume transmitting
              live orders with nobody watching.</b> Leave this off to bring them back
              stopped and press Start yourself.` : ""),
    } : null,
  });
  if(!r) return;

  showRestarting();
  try{
    await POST("/api/restart", {confirm:"RESTART", resume: !!(r && r.checked)});
  }catch(e){
    hideRestarting();
    toast(esc(e.message), "err", 9000);
    return;
  }
  waitForServer();
}

function showRestarting(){
  if(el("rveil")) return;
  const d = document.createElement("div");
  d.className = "veil";
  d.id = "rveil";
  d.innerHTML = `<div class="modal" style="text-align:center">
    <h3>Restarting…</h3>
    <div class="body" id="rmsg">Stopping the engines and relaunching the server.</div>
    <div class="dim2" style="font-size:11px;margin-top:12px">
      Your resting take-profits are untouched at Alpaca throughout.</div></div>`;
  document.body.appendChild(d);
}
function hideRestarting(){ const d = el("rveil"); if(d) d.remove(); }

async function waitForServer(){
  const started = Date.now();
  const msg = t => { const m = el("rmsg"); if(m) m.innerHTML = t; };
  // give the old process time to actually exit before believing an "up" answer
  await new Promise(r => setTimeout(r, 2500));
  for(let i = 0; i < 90; i++){
    try{
      const r = await fetch("/api/overview", {cache:"no-store"});
      if(r.ok){ msg("Back up — reloading the dashboard."); setTimeout(() => location.reload(), 600); return; }
    }catch(e){ /* still down, which is expected */ }
    msg(`Waiting for the server to come back… ${Math.round((Date.now()-started)/1000)}s`);
    await new Promise(r => setTimeout(r, 700));
  }
  msg(`<span class="neg">The server hasn't come back after 70s.</span><br>
       Check the console window — it may be waiting at a prompt, or the code may
       have an error that stops it booting.`);
}

/* ============================== field schema ==============================

function fieldHTML(f, val){
  const v = val === undefined ? "" : val;
  let input;
  if(f.t === "sel"){
    input = `<select name="${f.k}">` + f.opts.map(([o,l]) =>
      `<option value="${o}"${String(v)===o?" selected":""}>${l}</option>`).join("") + `</select>`;
  }else if(f.t === "bool"){
    input = `<select name="${f.k}"><option value=""${!v?" selected":""}>no</option>`
          + `<option value="true"${v?" selected":""}>yes</option></select>`;
  }else if(f.t === "num"){
    input = `<input name="${f.k}" type="number" value="${esc(v)}"`
          + (f.step!==undefined?` step="${f.step}"`:"") + (f.min!==undefined?` min="${f.min}"`:"") + `>`;
  }else if(f.t === "area"){
    return `<div style="margin-bottom:4px"><label class="dim" style="font-size:11px">${f.label}</label>
            <textarea name="${f.k}" style="margin-top:4px">${esc(v)}</textarea></div>`;
  }else{
    input = `<input name="${f.k}" value="${esc(v)}">`;
  }
  return `<div class="row"><label>${f.label}</label>${input}</div>`
       + (f.hint ? `<div class="hint">${f.hint}</div>` : "");
}

function strategyFormHTML(cfg, {omit=[]}={}){
  return STRATEGY_FIELDS.map(g => {
    const rows = g.fields.filter(f => !omit.includes(f.k))
                         .map(f => fieldHTML(f, cfg[f.k])).join("");
    return rows ? `<fieldset><legend>${g.legend}</legend>${rows}</fieldset>` : "";
  }).join("");
}

/* A <form> gives every value back as a string. Booleans are "" / "true" and
   the engine coerces the numbers, but sending "" for a number would be read
   as 0 -- so blanks are dropped rather than saved. */
function formPatch(form){
  const out = {};
  for(const [k, v] of new FormData(form).entries()){
    const f = STRATEGY_FIELDS.flatMap(g => g.fields).find(x => x.k === k);
    if(f && f.t === "num" && String(v).trim() === "") continue;
    out[k] = (f && f.t === "bool") ? (v === "true") : v;
  }
  return out;
}

function go(view){
  S.view = view;
  S.st = null;
  S.touched = false;
  location.hash = view.kind === "ticker" ? `#/t/${view.sym}/${view.tab||"live"}`
                : view.kind === "overview" ? "#/" : `#/${view.kind}`;
  render(true);
  tick();
}
function readHash(){
  const h = (location.hash || "#/").slice(2).split("/").filter(Boolean);
  if(h[0] === "t" && h[1]) return {kind:"ticker", sym:h[1].toUpperCase(), tab:h[2]||"live"};
  if(h[0] === "add") return {kind:"add"};
  if(h[0] === "settings") return {kind:"settings"};
  if(h[0] === "performance") return {kind:"performance"};
  if(h[0] === "agents") return {kind:"agents"};
  return {kind:"overview"};
}

      <td>${x.qty}</td><td>${px(x.avg_entry_price,4)}</td><td>${px(x.current_price)}</td>
      <td>${money(x.cost_basis)}</td><td>${money(x.market_value)}</td>
      <td>${sign(x.unrealized_pl)}</td>
      <td class="${x.unrealized_plpc>0?'pos':x.unrealized_plpc<0?'neg':'dim'}">${x.unrealized_plpc.toFixed(2)}%</td>
    </tr>`).join("") : `<tr><td colspan="8" class="empty">Flat — the account holds nothing.</td></tr>`;

  el("ovOrdCount").textContent = p.orders.length + " working";
  el("ovOrders").innerHTML = p.orders.length ? p.orders.map(o => `<tr>
      <td><b>${o.symbol}</b></td><td class="dim" style="font-size:10.5px">${esc(o.coid)}</td>
      <td class="${o.side==='sell'?'pos':'acc'}">${o.side.toUpperCase()}</td>
      <td>${o.qty}</td><td>${o.filled?'<span class="pos">'+o.filled+'</span>':0}</td>
      <td><b>${o.remaining}</b></td><td>${px(o.limit)}</td>
      <td class="${o.extended_hours?'pos':'dim2'}">${o.extended_hours?"yes":"no"}</td>
      <td class="dim">${esc(o.status)}</td></tr>`).join("")
    : `<tr><td colspan="9" class="empty">Nothing working at Alpaca.</td></tr>`;

  el("ovLog").innerHTML = ov.events.map(e =>
    `<div class="le"><span class="t">${esc(e.t)}</span>
     <span class="sy">${esc(e.symbol||"")}</span>
     <span class="lv lv-${esc(e.level)}">${esc(e.level)}</span>
     <span>${esc(e.msg)}</span></div>`).join("");
}

/* ============================== ticker view ============================== */
function mountTicker(){
  const sym = S.view.sym, tab = S.view.tab || "live";
  const tabs = [["live","Live"],["orders","Positions & orders"],["settings","Settings"]];
  const st = el("subtabs");
  st.style.display = "flex";
  st.innerHTML = tabs.map(([k,l]) =>
    `<div class="tab ${tab===k?"on":""}" data-go="ticker" data-sym="${sym}" data-tab="${k}">${l}</div>`).join("");

  if(tab === "live")      mountTickerLive(sym);
  else if(tab === "orders") mountTickerOrders(sym);
  else                    el("view").innerHTML = `<div class="dim">Loading ${sym} settings…</div>`;
}

    </div>`;

  el("bStart").onclick = A(async () => { await POST(`/api/ticker/${sym}/start`); toast(`${sym} engine started.`, "ok"); });
  el("bStop").onclick  = A(async () => { await POST(`/api/ticker/${sym}/stop`);  toast(`${sym} engine stopped.`, "ok"); });
  el("bDisarm").onclick= A(async () => { await POST(`/api/ticker/${sym}/arm`, {live:false}); toast(`${sym} back in dry run.`, "ok"); });
  el("bClear").onclick = A(async () => { await POST(`/api/ticker/${sym}/clear_halt`); toast(`${sym} halt cleared.`, "ok"); });
  el("bRecover").onclick = A(async () => {
    const r = await POST(`/api/ticker/${sym}/ensure_tps`);
    if(r.failed) toast(`Placed ${r.placed}, but <b>${r.failed} lot(s) could not be covered</b>. `
        + `Usually the old sell is still cancelling and holding the shares — try again shortly.`, "err", 9000);
    else toast(`${sym}: re-covered ${r.placed||0} lot(s).`, "ok");
  });
  el("bCancel").onclick = A(async () => {
    if(!await ask({title:`Cancel every resting take-profit on ${sym}?`, danger:true, ok:"Cancel TPs",
      body:"The engine re-places them on its next tick. While the engine is <b>stopped</b> "
         + "nothing re-places them — use <b>Re-cover lots</b> after."})) return;
    const r = await POST(`/api/ticker/${sym}/cancel_tps`);

         + "take-profit is placed from that average. Use this after manual intervention."})) return;

    const per = (c.shares_per_lot||0) * (s.last_price||0);
    if(!await ask({title:`Arm live orders on ${sym}?`, danger:true, ok:"ARM", requireWord:"ARM",
      body:`<table style="width:100%;margin-bottom:10px">

        <tr><td style="border:0">Adds</td><td style="border:0">${c.add_mode==="points"?"every $"+c.add_distance+" down":

        <tr><td style="border:0">Cap</td><td style="border:0">${c.max_lots} lots ≈ ${money(s.max_exposure)}</td></tr>
        <tr><td style="border:0">Take profit</td><td style="border:0">$${c.take_profit}/share per lot</td></tr>
      </table><b class="neg">THERE IS NO STOP LOSS.</b> Only ${sym} is affected.`})) return;
    await POST(`/api/ticker/${sym}/arm`, {live:true, confirm:"ARM"});
    toast(`${sym} is ARMED — orders now transmit.`, "err", 8000);

  el("bFlatten").onclick = A(async () => {
    const s = S.st;
    if(!await ask({title:`Flatten ${sym}?`, danger:true, ok:"FLATTEN", requireWord:"FLATTEN",
      body:`Cancels every resting take-profit on ${sym} and <b>market-sells all
        ${s?s.alpaca.qty:"?"} shares</b> at whatever the book gives.<br><br>
        Other tickers are untouched.`})) return;
    const r = await POST(`/api/ticker/${sym}/flatten`, {confirm:"FLATTEN"});
    toast(`${sym} flattened: cancelled ${r.cancelled}, sold ${r.sold} sh.`, "ok");
  });
}

function paintTickerLive(){
  const s = S.st;
  if(!s) return;
  const A = s.alpaca, R = s.reconcile, P = s.pnl, c = s.config;

  el("tkPrice").textContent = s.last_price ? "$" + s.last_price.toFixed(2) : "—";
  el("tkQuote").textContent = s.bid && s.ask
      ? `bid ${s.bid.toFixed(2)} / ask ${s.ask.toFixed(2)}` : "no quote";
  el("tkTick").textContent = `last tick ${s.last_tick_at || "—"} · session ${s.session}`;
  const pill = (id,txt,cls) => { const e = el(id); e.textContent = txt; e.className = "pill " + cls; };
  pill("tkMode", s.dry_run ? "DRY RUN" : "ARMED — LIVE", s.dry_run ? "p-dry" : "p-live");
  pill("tkRun",  s.running ? "RUNNING" : "STOPPED", s.running ? "p-run" : "p-off");
  // the run pill already says STOPPED -- repeating it as the state adds nothing
  const stEl = el("tkState");
  if(s.state === "STOPPED"){ stEl.style.display = "none"; }
  else { stEl.style.display = ""; pill("tkState", s.state,
         s.halted ? "p-halt" : s.lot_count ? "p-run" : "p-off"); }

  const B = [];
  if(s.halted) B.push(`<div class="banner b-red"><b>⛔ HALTED</b> — ${esc(s.halt_reason)}<br>
      ${s.symbol} will not trade until you resolve this and press <b>Clear halt</b>.</div>`);
  if(!s.in_sync && !s.dry_run) B.push(`<div class="banner b-gold"><b>Out of sync</b> —
      Alpaca holds <b>${s.broker_qty}</b> shares of ${s.symbol}, the ledger says <b>${s.shares}</b>.</div>`);
  if(!s.dry_run && !s.halted) B.push(`<div class="banner b-red"><b>🔴 ARMED</b> —
      ${s.symbol} orders transmit to ${s.paper?"the paper":"the LIVE"} account. Max exposure at
      this ladder's cap is <b>${money(s.max_exposure)}</b> (${c.max_lots} × ${c.shares_per_lot} sh).
      There is <b>no stop loss</b>.</div>`);
  if(s.running && !s.halted && s.block_reason)
      B.push(`<div class="banner b-blue">Not looking for entries: <b>${esc(s.block_reason)}</b>.</div>`);
  const stale = (s.tps_extended||[]).filter(x => !x).length;
  if(s.extended_ok && stale) B.push(`<div class="banner b-red"><b>${stale} resting take-profit(s)
      cannot fill in extended hours</b> — they were submitted before extended hours was enabled and
      the flag is fixed at submission. Press <b>Cancel resting TPs</b>; the engine re-places them
      correctly on the next tick.</div>`);
  if(R.uncovered > 0) B.push(`<div class="banner b-red"><b>⚠ ${R.uncovered} shares have no resting
      sell against them</b> — they will not exit on their own. Press <b>Re-cover lots</b>, or start
      the engine and it places them on the next tick.</div>`);
  if(s.last_error) B.push(`<div class="banner b-gold">Last error: ${esc(s.last_error)}</div>`);
  if(s.autostart) B.push(`<div class="banner b-blue"><b>Autostart is on</b> — this engine starts
      with the dashboard, in whatever armed state it was left in.</div>`);
  if(c.exit_mode === "trail" && !c.trail_use_broker_stop) B.push(`<div class="banner b-gold"><b>Trailing exits — nothing is
      resting at Alpaca for ${s.symbol}.</b> Each lot is watched here and the exit order is sent
      only when its trail trips. Upside is uncapped, but <b>if this app stops, no exit exists</b>
      — the lots simply wait until it is running again.
      ${s.armed_lots ? `<br><b>${s.armed_lots} lot(s) currently armed and trailing.</b>` : ""}</div>`);
  if(c.exit_mode === "trail" && c.trail_use_broker_stop) B.push(`<div class="banner b-blue"><b>Trailing exits with broker stop.</b>
      When a lot arms, a GTC Alpaca trailing_stop is rested (trail $${Number(c.trail_amount||0.05).toFixed(2)}).
      In-process trail is backup if that order is missing.
      ${s.armed_lots ? `<br><b>${s.armed_lots} lot(s) currently armed and trailing.</b>` : ""}</div>`);
  if(s.reconciles_this_hour) B.push(`<div class="banner b-gold"><b>Position auto-corrected
      ${s.reconciles_this_hour}× in the last hour</b> — the ladder was re-synced to what
      Alpaca actually holds instead of halting. Once or twice is a normal partial-fill
      race; repeatedly means something upstream is wrong, and at
      ${6} it halts rather than churning lots.</div>`);
  if(s.config && s.config.auto_reconcile === false) B.push(`<div class="banner b-gold">
      <b>Auto-fix is off for ${s.symbol}</b> — a position disagreement will HALT this
      ladder until you clear it by hand.</div>`);
  el("tkBanners").innerHTML = B.join("");

  const bar = s.last_bar;
  const exitBadge = c.exit_mode === "trail"
    ? `<span class="pill p-purple">TRAIL $${Number(c.trail_amount||0.05).toFixed(2)}</span>`
      + (s.armed_lots ? ` <span class="pos">${s.armed_lots} armed</span>` : "")
    : "";
  const stack = s.strategy_stack || [];
  const stackEl = el("tkStack");
  if(stackEl){
    stackEl.innerHTML = stack.length ? stack.map(r => {
      const b = (r.bias||"").toLowerCase();
      const cls = b==="long"?"pos":b==="short"?"neg":"dim";
      return `<tr><td>${esc(r.name||"")}<div class="dim2">${esc(r.note||"")}</div></td>
        <td>${esc(r.timeframe||"")}</td><td>${esc(r.params||"")}</td>
        <td>${r.last==null||r.last===""?"—":esc(String(r.last))}</td>
        <td class="${cls}">${esc(r.bias||"—")}</td></tr>`;
    }).join("") : `<tr><td colspan="5" class="empty">Need HTF bars (1h/4h) before the stack can vote.</td></tr>`;
  }
  const sn = el("tkStackNote");
  if(sn) sn.innerHTML = `Combined bias <b>${esc(s.bias||"flat")}</b> · 4h side ${s["4h_side"]||0} · 1h ST ${s["1h_st"]||0} · 1m ST ${s["1m_st"]||0}. Side mode ${esc(c.side_mode||"auto")}. Never shorts over a long ledger.`;
  el("tkLadderR").innerHTML = exitBadge + ` ${c.add_mode === "points" ? "adds every $"+Number(c.add_distance).toFixed(2)+" down"
      : c.add_mode === "percent" ? "adds every "+Number(c.add_percent)+"% down" : "adds on any close below avg"}
      · ${c.exit_mode === "trail" ? "arms at" : "TP"} $${Number(c.take_profit).toFixed(2)}/sh · ${c.bar_size} bars`;
  el("tkStats").innerHTML =
      stat("Lots", `${s.lot_count} <span class="dim" style="font-size:12px">/ ${c.max_lots}</span>`)
    + stat("Shares", s.shares, s.in_sync ? "in sync with Alpaca" : `Alpaca: ${s.broker_qty}`)
    + stat("Ladder avg", px(s.avg_price,4))
    + stat("Next add at", px(s.next_add_at))
    + stat("Open P/L", sign(s.unrealized))
    + stat("Per-lot wins", `${s.closed_count}`, "today " + money(s.realized_today))
    + stat("Last bar", bar ? `<span class="${bar.color==='red'?'neg':bar.color==='green'?'pos':'dim'}">${bar.color}</span>` : "—",
           bar ? "close $" + Number(bar.c).toFixed(2) : "")
    + stat("Ladder cost", money(s.cost_basis),
           Math.abs(s.cost_basis - A.cost_basis) > 0.5
             ? "Alpaca (avg-cost): " + money(A.cost_basis) : "matches Alpaca");

  const byCoid = Object.fromEntries(A.orders.map(o => [o.coid, o]));
  el("tkLots").innerHTML = s.lots.length ? s.lots.map(l => {
    const pl = (s.last_price - l.entry_price) * l.shares;
    const toTp = l.tp_price - s.last_price;
    const o = byCoid[l.tp_client_id];
    const sell = o ? `<span class="pos">${o.remaining} sh @ $${o.limit.toFixed(2)}</span>`
                     + (o.filled ? `<br><span class="dim2">${o.filled} of ${o.qty} already sold</span>` : "")
                   : s.dry_run ? '<span class="dim">dry run</span>'
                               : '<span class="neg">NO RESTING SELL</span>';
    return `<tr><td>${esc(l.id)}</td><td>${l.shares}</td><td>$${l.entry_price.toFixed(4)}</td>
      <td>$${l.tp_price.toFixed(2)}</td>
      <td class="${toTp<=0?'pos':'dim'}">${toTp<=0?"AT TARGET":"$"+toTp.toFixed(2)}</td>
      <td>${sign(pl)}</td><td>${sell}</td></tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">Flat — no open lots on ${s.symbol}.</td></tr>`;

  el("tkMoney").innerHTML =
      stat("Position value", money(A.market_value))
    + stat("Cost basis", money(A.cost_basis))
    + stat("Open P/L", sign(A.unrealized_pl),
           A.unrealized_plpc ? A.unrealized_plpc.toFixed(2) + "% since entry" : "")
    + stat("Since yesterday", sign(P.open_today))
    + stat("Realized today", sign(P.realized_ladder), "this ladder's own lots")
    + stat("Realized all time", sign(s.realized_all), s.closed_count + " lots closed");

  el("tkMoneyNote").innerHTML = `<div class="banner b-blue" style="margin:13px 0 0">
    <b>Two different questions</b>
    <table style="margin-top:8px;width:auto;min-width:360px">
      <tr><td style="border:0">Open lots since <b>yesterday's close</b></td>
          <td style="border:0">${sign(P.open_today)}</td></tr>
      <tr><td style="border:0">Open lots since <b>they were bought</b></td>
          <td style="border:0">${sign(P.open_since_entry)}</td></tr>
      <tr><td style="border:0">Sold by this ladder today</td>
          <td style="border:0">${sign(P.realized_ladder)}</td></tr>
    </table>
    <span class="dim">Your account measures "today" from yesterday's close, which is why those
    first two differ on anything held overnight. The account-wide roll-up is on the
    <a href="#/">Overview</a>.</span></div>`;

  el("tkLog").innerHTML = s.events.map(e =>
    `<div class="le"><span class="t">${esc(e.t)}</span>
     <span class="lv lv-${esc(e.level)}">${esc(e.level)}</span>
     <span>${esc(e.msg)}</span></div>`).join("");

  el("bStart").disabled  = s.running;
  el("bStop").disabled   = !s.running;
  el("bArm").disabled    = !s.dry_run;
  el("bDisarm").disabled = s.dry_run;
  el("bClear").disabled  = !s.halted;
}

function mountTickerOrders(sym){
  el("view").innerHTML = `
    <div class="panel"><h2>${sym} position at Alpaca <span class="r" id="poAsOf"></span></h2>
      <div class="stats" id="poStats"></div>
      <div id="poRec"></div>
    </div>
    <div class="panel"><h2>Working orders <span class="r" id="poCount"></span></h2>
      <div class="tblwrap"><table>
        <thead><tr><th>Client order id</th><th>Side</th><th>Qty</th><th>Filled</th>
          <th>Working</th><th>Limit</th><th title="can this order fill outside 09:30-16:00?">Ext hrs</th>
          <th>Status</th></tr></thead>
        <tbody id="poOrders"></tbody></table></div>
    </div>
    <div class="panel"><h2>Order history
        <span class="r"><button class="sm" id="poReload">Reload</button></span></h2>
      <div class="tblwrap"><table>
        <thead><tr><th>Submitted</th><th>Client order id</th><th>Side</th><th>Type</th>
          <th>Qty</th><th>Filled</th><th>Avg fill</th><th>Limit</th><th>Status</th></tr></thead>
        <tbody id="poHist"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody></table></div>
    </div>`;
  el("poReload").onclick = () => loadHistory(sym);
  loadHistory(sym);
}

async function loadHistory(sym){
  try{
    const rows = await GET(`/api/ticker/${sym}/orders?status=all&limit=100`);
    const b = el("poHist");
    if(!b) return;
    b.innerHTML = rows.length ? rows.map(o => `<tr>
        <td class="dim">${esc((o.submitted_at||"").slice(11,19))}</td>
        <td class="dim" style="font-size:10.5px">${esc(o.client_order_id||"")}</td>
        <td class="${o.side==='sell'?'pos':'acc'}">${esc((o.side||"").toUpperCase())}</td>
        <td class="dim">${esc(o.type||"")}</td>
        <td>${Number(o.qty||0)}</td>
        <td>${Number(o.filled_qty||0)}</td>
        <td>${o.filled_avg_price?"$"+Number(o.filled_avg_price).toFixed(4):"—"}</td>
        <td>${o.limit_price?"$"+Number(o.limit_price).toFixed(2):"—"}</td>
        <td class="${o.status==='filled'?'pos':o.status==='canceled'?'dim2':'dim'}">${esc(o.status||"")}</td>
      </tr>`).join("") : `<tr><td colspan="9" class="empty">No orders on record.</td></tr>`;
  }catch(e){
    const b = el("poHist");
    if(b) b.innerHTML = `<tr><td colspan="9" class="empty neg">${esc(e.message)}</td></tr>`;
  }
}

function paintTickerOrders(){
  const s = S.st;
  if(!s || !el("poStats")) return;
  const A = s.alpaca, R = s.reconcile;
  el("poAsOf").textContent = s.pnl.account_as_of ? "read " + s.pnl.account_as_of : "";
  el("poStats").innerHTML =
      stat("Shares held", A.qty)
    + stat("Avg entry", px(A.avg_entry_price,4))
    + stat("Cost basis", money(A.cost_basis))
    + stat("Market value", money(A.market_value))
    + stat("Open P/L", sign(A.unrealized_pl))
    + stat("Current price", px(A.current_price));

  let rec = `<div class="banner ${R.in_sync?'b-blue':'b-red'}" style="margin:13px 0 0">
      <b>${R.in_sync?'✓ In sync':'✗ OUT OF SYNC'}</b> — Alpaca holds <b>${R.alpaca_shares}</b> sh,
      the ladder tracks <b>${R.ledger_shares}</b> sh. Covered by resting sells:
      <b>${R.covered_shares}</b>${R.uncovered ? ` · <span class="neg">uncovered: ${R.uncovered}</span>` : ""}.`;

function mountTickerSettings(){

  el("view").innerHTML = `

        </form>
      </div>
      <div>
        <div class="panel"><h2>What this ladder does</h2>
          <div class="stats" id="tsSummary"></div>
          <div class="note" id="tsNote"></div>
        </div>
        <div class="panel"><h2>Danger zone</h2>
          <div class="note" style="margin-top:0">Removing a ticker deletes its settings from the
            fleet. Its ledger file is kept and <b>nothing at Alpaca is cancelled or sold</b> —
            flatten it first if that is what you want.</div>
          <div class="ctl" style="margin-top:11px">
            <button class="b-arm" id="bRemove">Remove ${sym} from the fleet</button>
          </div>
        </div>
      </div>
    </div>`;

  const f = el("tform");
  f.addEventListener("input", () => { S.touched = true; });
  f.addEventListener("submit", async e => {
    e.preventDefault();
    await act(async () => {
      const r = await POST(`/api/ticker/${sym}/config`, formPatch(f));
      S.touched = false;
      el("tsaveMsg").innerHTML = `<span class="pos">Saved — live on ${sym}'s next tick.</span>`;
      setTimeout(() => { const m = el("tsaveMsg"); if(m) m.textContent = ""; }, 4000);
      toast(`${sym} settings saved.`, "ok");
    });
  });
  el("bRemove").onclick = () => act(async () => {
    if(!await ask({title:`Remove ${sym}?`, danger:true, ok:"Remove", requireWord:sym,
      body:`${sym} stops being managed by the fleet. Its ledger file stays on disk and any
            position or resting order at Alpaca is <b>left exactly as it is</b>.`})) return;
    try{
      await DEL(`/api/ticker/${sym}`);

    S.add.results = r.results;
    el("aqHint").textContent = r.ready ? `${r.results.length} match(es)`

async function loadTemplate(){

function addMath(){
  const f = el("aform"), r = S.add.inspect;
  if(!f || !r) return;
  const p = formPatch(f);
  const price = r.price || 0;
  const per = (Number(p.shares_per_lot)||0) * price;
  const maxx = per * (Number(p.max_lots)||0);
  const win = (Number(p.take_profit)||0) * (Number(p.shares_per_lot)||0);
  const bp = S.ov ? S.ov.portfolio.buying_power : 0;
  el("aMath").innerHTML =
      stat("Per lot", money(per), `${p.shares_per_lot||0} sh @ ${px(price)}`)
    + stat("Max exposure", money(maxx), `${p.max_lots||0} lots`)
    + stat("Win per lot", money(win), "before fees")
    + stat("Of buying power",
           bp ? `<span class="${maxx>bp?'neg':maxx>bp*0.5?'gold':'pos'}">${Math.round(100*maxx/bp)}%</span>` : "—",
           bp ? (maxx > bp ? "more than the account has" : "have " + money0(bp)) : "");
}

async function doAdd(){
  const r = S.add.inspect;
  if(!r || !r.ok) return;
  const f = el("aform");
  const cfg = formPatch(f);
  const per = (Number(cfg.shares_per_lot)||0) * (r.price||0);
  if(!await ask({title:`Add ${r.symbol} to the fleet?`, ok:"Add ticker",
    body:`A new ladder is created for <b>${r.symbol}</b> with its own ledger and its own
      settings.<br><br>Each lot ≈ <b>${money(per)}</b>, up to <b>${cfg.max_lots}</b> lots
      ≈ <b>${money(per * (Number(cfg.max_lots)||0))}</b>.<br><br>
      It arrives <b>stopped and in dry run</b> — nothing transmits until you arm it.`})) return;
  await POST("/api/tickers", {symbol:r.symbol, copy_from:S.add.copyFrom || "", config:cfg});
  toast(`${r.symbol} added — stopped and in dry run.`, "ok");
  await tick();
  go({kind:"ticker", sym:r.symbol, tab:"live"});
}

/* schedule controls per mode -- deliberately not a cron box, because the whole
   point of the switch is that you do not have to remember cron syntax */
function schedControls(j){
  const s = j.schedule, id = j.id;
  const sel = (k, opts, val) => `<select data-job="${id}" data-k="${k}">` +
    opts.map(([v,l]) => `<option value="${v}"${String(val)===String(v)?" selected":""}>${l}</option>`).join("")
    + `</select>`;
  let extra = "";
  if(s.mode === "interval"){
    extra = sel("interval_minutes", [[15,"every 15 min"],[30,"every 30 min"],
      [60,"hourly"],[120,"every 2 h"],[240,"every 4 h"]], s.interval_minutes)
      + `<label class="dim" style="font-size:10.5px;display:flex;gap:5px;align-items:center">
         <input type="checkbox" data-job="${id}" data-k="market_hours_only"
           style="width:auto" ${s.market_hours_only?"checked":""}> only when a session is open</label>`;
  }else if(s.mode === "daily"){
    extra = `<input data-job="${id}" data-k="time" value="${esc(s.time)}" style="width:72px">`
      + `<label class="dim" style="font-size:10.5px;display:flex;gap:5px;align-items:center">
         <input type="checkbox" data-job="${id}" data-k="weekdays_only"
           style="width:auto" ${s.weekdays_only?"checked":""}> weekdays only</label>`;
  }else if(s.mode === "weekly"){
    extra = sel("weekday", DOW.map((d,i)=>[i,d]), s.weekday)
      + `<input data-job="${id}" data-k="time" value="${esc(s.time)}" style="width:72px">`;
  }
  return sel("mode", [["manual","only when I press Run"],["interval","every N minutes"],
    ["daily","once a day"],["weekly","once a week"]], s.mode) + extra;
}

function paintAgents(){
  const d = S.agents, au = S.audit;
  if(!d || !el("agCards")) return;

  el("agBanner").innerHTML = d.ready.ready ? "" :
    `<div class="banner b-gold"><b>Agents cannot run yet</b> — ${esc(d.ready.problem)}<br>
     ${esc(d.ready.fix)}<br><span class="dim">Schedules below still save; every run
     until then is recorded as blocked rather than failing silently.</span></div>`;

  el("agRunning").innerHTML = d.running
    ? `<span class="pos">▶ ${esc(d.running)} running — ${d.running_for}s</span>`
    : `<span class="dim2">idle</span>`;

  el("agCards").innerHTML = d.jobs.map(j => {
    const s = j.schedule, arms = j.risk === "arms";
    const last = j.last_run;
    const lastLine = !last ? `<span class="dim2">never run</span>`
      : `<span class="${last.ok?'pos':last.status==='blocked'?'gold':'neg'}">${
          last.ok?"✓ ok":last.status==="blocked"?"blocked":"✗ "+esc(last.status)}</span>
         <span class="dim2">${esc(String(last.ts).slice(5,16).replace("T"," "))}
         · ${last.seconds||0}s${last.cost_usd?" · $"+Number(last.cost_usd).toFixed(3):""}
         · ${esc(last.trigger||"")}</span>`;
    return `<div class="acard ${arms?"arms":s.enabled?"on":""}">
      <div class="ahead">
        <label class="sw ${arms?"danger":""}">
          <input type="checkbox" data-job="${j.id}" data-k="enabled" ${s.enabled?"checked":""}><i></i></label>
        <span class="t">${esc(j.label)}</span>
        ${arms?'<span class="pill p-live">CAN ARM</span>':""}
        ${j.risk==="tunes"?'<span class="pill p-purple">CHANGES SETTINGS</span>':""}
        ${j.risk==="adds"?'<span class="pill p-dry">ADDS TICKERS</span>':""}
        <span class="a" style="margin-left:auto">${esc(j.agent)}</span>
      </div>
      <div class="ablurb">${j.blurb}</div>
      <div class="actrl">${schedControls(j)}
        <button class="sm b-acc" data-run="${j.id}" ${d.running?"disabled":""}>▶ Run now</button>
        ${j.next_run_at && s.enabled ? `<span class="dim2" style="font-size:10.5px">next ${esc(j.next_run_at)}</span>` : ""}
      </div>
      <div class="arun">${lastLine}
        ${last && (last.output||last.error) ? `<div class="aout">${esc(
            (last.output||"").trim() || last.error || "")}</div>` : ""}</div>
    </div>`;
  }).join("");

  // wire the controls fresh each paint -- they are rebuilt every time
  el("agCards").querySelectorAll("[data-job]").forEach(n => {
    n.onchange = async () => {
      const v = n.type === "checkbox" ? n.checked : n.value;
      try{
        await POST(`/api/agents/${n.dataset.job}`, {[n.dataset.k]: v});
        await loadAgents();
      }catch(e){ toast(esc(e.message), "err"); }
    };
  });
  el("agCards").querySelectorAll("[data-run]").forEach(n => {
    n.onclick = async () => {
      const id = n.dataset.run;
      try{
        const r = await POST(`/api/agents/${id}/run`, {trigger:"dashboard"});
        if(r.ok){ toast(`${id} started — this takes a minute or two.`, "ok"); }
        else toast(esc(r.error||"could not start"), "err");
        await loadAgents();
      }catch(e){ toast(esc(e.message), "err"); }
    };
  });

  el("agFreeze").innerHTML = (au && au.frozen)
    ? `<div class="banner b-red" style="margin:0"><b>🧊 FROZEN</b> — ${esc(au.frozen)}</div>`
    : `<div class="banner b-green" style="margin:0">Not frozen. Agents may arm.</div>`;

  const rows = (au && au.entries) || [];
  el("agRows").innerHTML = rows.length ? rows.map(e => `<tr>
      <td class="dim">${esc(String(e.ts).slice(5,16).replace("T"," "))}</td>
      <td class="acc">${esc(e.actor||"")}</td>
      <td><b>${esc(e.action||"")}</b></td>
      <td class="${e.ok?'pos':'neg'}">${e.ok?"":"REFUSED"}</td>
    </tr>`).join("") : `<tr><td colspan="4" class="empty">Nothing yet.</td></tr>`;
}

/* ============================== settings ============================== */
function mountSettings(){
  el("subtabs").style.display = "none";
  el("view").innerHTML = `
    <div class="cols">
      <div class="panel">
        <h2>Account-wide settings <span class="r">applies to every ladder</span></h2>
        <form id="gform" class="form">
          <fieldset><legend>Engine</legend>
            <div class="row"><label>Poll seconds</label>
              <input name="poll_seconds" type="number" step="0.5" min="1"></div>
            <div class="hint">How often the fleet reads Alpaca <b>once for all tickers</b>.
              Positions, orders, quotes and bars are batched into a handful of requests per
              cycle, so adding tickers costs almost nothing here — but Alpaca allows
              ~200 requests/minute for the whole account, so don't go below 1s.</div>
            <div class="row"><label>Data feed</label>
              <select name="feed">
                <option value="auto">auto — boats overnight, sip otherwise</option>
                <option value="sip">sip</option><option value="iex">iex</option>
                <option value="boats">boats (overnight)</option></select></div>
            <div class="hint">The SIP tape is dark 20:00–04:00 ET. On <b>auto</b> the fleet
              switches to Blue Ocean overnight by itself.</div>
            <div class="row"><label>Dashboard refresh (ms)</label>
              <input name="ui_refresh_ms" type="number" step="500" min="500"></div>
          </fieldset>
          <fieldset><legend>Portfolio guardrails — 0 turns one off</legend>
            <div class="row"><label>Max total exposure ($)</label>
              <input name="max_total_exposure" type="number" step="1000" min="0"></div>
            <div class="hint">Cost basis across <b>every</b> ladder. A ladder that would push
              the account past this simply stops adding — it is not halted.</div>
            <div class="row"><label>Cash reserve ($)</label>
              <input name="reserve_cash" type="number" step="1000" min="0"></div>
            <div class="hint">Buying power the fleet will never spend.</div>
            <div class="row"><label>Account daily loss limit ($)</label>
              <input name="account_daily_loss_limit" type="number" step="100" min="0"></div>
            <div class="hint">Measured on the <b>account</b>, not one ladder. Hitting it halts
              every ladder at once — the check no individual engine can make for itself.</div>
            <div class="row"><label>Max running tickers</label>
              <input name="max_running_tickers" type="number" step="1" min="0"></div>
          </fieldset>
          <button type="submit" class="b-go" style="width:100%">Save settings</button>
          <div class="note" id="gsaveMsg"></div>
        </form>
      </div>
      <div>
        <div class="panel"><h2>Account</h2><div class="stats" id="setAcct"></div>
          <div class="note" id="setNote"></div></div>
        <div class="panel"><h2>Tickers</h2>
          <div class="tblwrap"><table>
            <thead><tr><th>Symbol</th><th>State</th><th>Lots</th><th>Autostart</th><th></th></tr></thead>
            <tbody id="setTickers"></tbody></table></div>
          <div class="ctl" style="margin-top:12px"><button class="b-acc" data-go="add">+ Add a ticker</button></div>
        </div>
        <div class="panel"><h2>Fleet controls</h2>
          <div class="ctl">
            <button class="b-go" id="sStart">▶ Start all</button>
            <button id="sStop">■ Stop all</button>
            <button class="b-warn" id="sDisarm">Disarm all</button>
            <button class="b-arm" id="sPanic">PANIC</button>
          </div>
          <div class="note">PANIC stops and disarms everything. It does <b>not</b> sell —
            positions and their resting take-profits are left alone.</div>
          <div class="ctl" style="margin-top:13px;padding-top:13px;border-top:1px solid var(--line)">
            <button class="b-acc" id="sRestart" style="flex:1">⟳ Restart dashboard</button>
          </div>
          <div class="note" id="sRestartNote">Relaunches the server so new code and settings
            take effect, without touching the console window.</div>
        </div>
      </div>
    </div>`;

  const f = el("gform");
  f.addEventListener("input", () => { S.touched = true; });
  f.addEventListener("submit", async e => {
    e.preventDefault();
    await act(async () => {
      const patch = {};
      for(const [k,v] of new FormData(f).entries()) if(String(v).trim() !== "") patch[k] = v;
      await POST("/api/settings", patch);
      S.touched = false;
      toast("Settings saved.", "ok");
      el("gsaveMsg").innerHTML = `<span class="pos">Saved.</span>`;
      setTimeout(() => { const m = el("gsaveMsg"); if(m) m.textContent = ""; }, 3500);
    });
  });
  el("sStart").onclick  = () => act(async () => { const r = await POST("/api/fleet/start_all"); toast(`Started ${r.started}.`, "ok"); });
  el("sStop").onclick   = () => act(async () => { const r = await POST("/api/fleet/stop_all"); toast(`Stopped ${r.stopped}.`, "ok"); });
  el("sDisarm").onclick = () => act(async () => { const r = await POST("/api/fleet/disarm_all"); toast(`Disarmed ${r.disarmed}.`, "ok"); });
  el("sRestart").onclick = doRestart;
  el("sPanic").onclick  = () => el("bPanic") ? el("bPanic").click() : act(async () => {
    if(!await ask({title:"PANIC — stop and disarm everything?", danger:true, ok:"PANIC",
      requireWord:"PANIC", body:"Nothing is sold. Positions and resting take-profits are left alone."})) return;
    await POST("/api/fleet/panic", {confirm:"PANIC"});
    toast("Everything stopped and disarmed.", "ok");
  });
}

function paintSettings(){
  const ov = S.ov;
  if(!ov || !el("setAcct")) return;
  const f = el("gform");
  if(f && !S.touched){
    for(const [k,v] of Object.entries(ov.global)){
      const e = f.elements[k];
      if(e && e.type !== "submit") e.value = v;
    }
  }
  const p = ov.portfolio;
  el("setAcct").innerHTML =
      stat("Number", esc(ov.account.number||"—"))
    + stat("Mode", ov.paper ? "PAPER" : '<span class="neg">LIVE</span>')
    + stat("Equity", money(p.account_value))
    + stat("Cash", money(p.cash))
    + stat("Buying power", money(p.buying_power))
    + stat("Deployed", money(p.deployed));
  const rn = el("sRestartNote");
  if(rn && ov.supervised === false)
    rn.innerHTML = `<span class="gold">Unavailable</span> — this server wasn't launched by
      <code>start_bot.bat</code>, so nothing would bring it back up. Relaunch with
      <b>start_bot.bat</b> to enable it.`;
  el("setNote").innerHTML = `Market data ${ov.snap_error
      ? `<span class="neg">failing: ${esc(ov.snap_error)}</span>`
      : `<span class="pos">healthy</span>, ${ov.snap_age}s old`} ·
      session <b>${esc(ov.session)}</b> on the <b>${esc(ov.feed)}</b> feed.
      Keys and the paper/live endpoint come from <code>.env</code> and are not editable here.`;

  el("setTickers").innerHTML = ov.tickers.length ? ov.tickers.map(t => `<tr>
      <td><b>${t.symbol}</b></td>
      <td><span class="pill ${t.halted?"p-halt":t.running?(t.dry_run?"p-run":"p-live"):"p-off"}">${esc(t.state)}</span></td>
      <td>${t.lot_count}/${t.max_lots}</td>
      <td class="${t.autostart?'gold':'dim2'}">${t.autostart?"on":"off"}</td>
      <td><button class="sm" data-go="ticker" data-sym="${t.symbol}" data-tab="settings">Open</button></td>
    </tr>`).join("") : `<tr><td colspan="5" class="empty">No tickers configured.</td></tr>`;
}

/* ============================== render loop ============================== */
function sig(){
  const v = S.view;
  return v.kind === "ticker" ? `ticker:${v.sym}:${v.tab||"live"}` : v.kind;
}

function render(force){
  const s = sig();
  if(force || S.mounted !== s){
    S.mounted = s;
    S.touched = false;
    if(S.view.kind === "overview") mountOverview();
    else if(S.view.kind === "ticker") mountTicker();
    else if(S.view.kind === "add") mountAdd();
    else if(S.view.kind === "settings") mountSettings();
    else if(S.view.kind === "performance") mountPerformance();
    else if(S.view.kind === "agents") mountAgents();
  }
  paintTop();
  paintSidebar();
  try{
    if(S.view.kind === "overview" && S.ov) paintOverview();
    else if(S.view.kind === "settings" && S.ov) paintSettings();
    else if(S.view.kind === "performance") paintPerformance();
    else if(S.view.kind === "agents"){
      paintAgents();
      // an agent run takes minutes; poll so the card updates itself
      if(S.agents && (S.agents.running || Date.now() - (S._agAt||0) > 8000)){
        S._agAt = Date.now();
        loadAgents();
      }
    }
    else if(S.view.kind === "ticker" && S.st){
      const tab = S.view.tab || "live";
      if(tab === "live") paintTickerLive();
      else if(tab === "orders") paintTickerOrders();
      else if(tab === "settings"){
        // the form is built from the config, so it is mounted only once the
        // status has actually arrived -- and never repainted while being typed in
        if(!el("tform")) mountTickerSettings();
        if(!S.touched) paintTickerSettings();
      }
    }
  }catch(e){
    console.error(e);
    el("view").insertAdjacentHTML("afterbegin",
      `<div class="banner b-red"><b>Dashboard render error:</b> ${esc(e.message)}<br>
       <span class="dim">The bots are unaffected — this is display code only. Check the
       console, and use the Overview table for the numbers that matter.</span></div>`);
  }
}

async function tick(){
  try{
    S.ov = await GET("/api/overview");
  }catch(e){ return; }                       // server restarting -- next tick catches up
  if(S.view.kind === "ticker"){
    if(!S.ov.tickers.some(t => t.symbol === S.view.sym)){
      toast(`${S.view.sym} is no longer in the fleet.`, "err");
      go({kind:"overview"});
      return;
    }
    try{ S.st = await GET("/api/ticker/" + S.view.sym); }catch(e){}
  }
  render(false);
  const ms = Math.max(500, (S.ov.global && S.ov.global.ui_refresh_ms) || 2000);
  clearTimeout(S.timer);
  S.timer = setTimeout(tick, ms);
}

/* wrap an action so a failure is a toast, never a dead button */
async function act(fn){
  try{ await fn(); await tick(); }
  catch(e){ toast(esc(e.message), "err", 9000); }
}

/* one delegated click handler for every navigation control on the page */
document.addEventListener("click", e => {
  const pk = e.target.closest("[data-pick]");
  if(pk){ pick(pk.dataset.pick); return; }
  const g = e.target.closest("[data-go]");
  if(!g) return;
  e.preventDefault();
  const k = g.dataset.go;
  go(k === "ticker" ? {kind:"ticker", sym:g.dataset.sym, tab:g.dataset.tab || "live"} : {kind:k});
});
window.addEventListener("hashchange", () => {
  const v = readHash();
  if(sig() !== (v.kind === "ticker" ? `ticker:${v.sym}:${v.tab}` : v.kind)) go(v);
});

S.view = readHash();
render(true);
tick();
</script>
</body>
