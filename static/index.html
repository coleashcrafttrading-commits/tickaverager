<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TickAverager</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-n"><span class="brand-dot off" id="brandDot"></span>TickAverager</div>
      <div class="brand-s" id="brandSub">connecting…</div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <div class="title" id="title">Loading…</div>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div class="spacer"></div>
      <div class="kpis" id="kpis"></div>
    </div>
    <div class="tabs" id="tabs" style="display:none"></div>
    <div class="scroll"><div class="page" id="view"></div></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>

<noscript><div style="padding:24px">This dashboard needs JavaScript.</div></noscript>

<script type="module" src="/ui/app.js"></script>
<script>
/* A module that fails to parse leaves a blank page, which looks exactly like
   the bot being broken. Say so instead, and say it loudly. */
window.addEventListener("error", function (e) {
  var v = document.getElementById("view");
  if (!v || v.dataset.failed) return;
  if (!(e.message || "").length) return;
  // Chrome reports an observer that resized what it watches as an error;
  // it is a warning about timing, not a failure, and never breaks the page
  if (/ResizeObserver loop/i.test(e.message || "")) return;
  v.dataset.failed = "1";
  v.innerHTML = '<div class="note bad"><b>The dashboard failed to load:</b> '
    + String(e.message).replace(/</g, "&lt;")
    + '<br><span class="faint">Your bots are unaffected — this is display code '
    + 'only. Positions and resting orders are still managed by the engine. '
    + 'Check the browser console for the stack.</span></div>';
});
</script>
</body>
</html>
