# Log caps for the Tick Avenger VM.
#
# WHY THIS FILE EXISTS. On 20 Nov 2026 the box filled its 9.7G disk completely
# -- 0 bytes free -- and both playbook workers died on every cycle with
# `OSError: [Errno 28] No space left on device`. systemd dutifully restarted
# them into the same wall 364 times in three days, so `systemctl is-active`
# said "active" for a stack that could not append a single ledger row. Nothing
# traded for weeks and the dashboard still answered, which is why it was not
# obvious.
#
# IT WAS LOGS, NOT DATA. Measured at the time:
#
#     /var/log                     4.6G   <-- the whole problem
#       syslog + syslog.1          3.0G
#       journald                   956M
#       google-cloud-ops-agent     612M
#     trading state                1.1G
#       play_decisions.jsonl x2    502M
#       play_ledger.jsonl x2       227M
#
# The trading data is a third of the logs and it is the half that must not be
# touched -- `play_ledger.jsonl` is the position history and
# `play_decisions.jsonl` is read by `optperf.report`, so neither is scratch.
# `compact_play_ledger.py` is the tool for those if they ever do become the
# problem. This file caps the logs instead, which is where the 4.6G was.
#
# The crash loop is also what made syslog 3G: once the disk is free the loop
# stops and the rate returns to normal. These caps are for the next time
# something loops, not for steady state.
#
# Install (as root):
#   cp deploy/tickaverager-logcaps.conf /etc/logrotate.d/tickaverager
#   mkdir -p /etc/systemd/journald.conf.d
#   cp deploy/tickaverager-journald.conf /etc/systemd/journald.conf.d/
#   systemctl restart systemd-journald
#   logrotate -f /etc/logrotate.d/tickaverager      # prove it runs

# The ops agent writes its own subagent logs and ships with no rotation of its
# own. 612M of a 9.7G disk, for logs about logging.
/var/log/google-cloud-ops-agent/subagents/*.log {
    size 50M
    rotate 2
    compress
    missingok
    notifempty
    copytruncate
}

# syslog already rotates daily on Ubuntu, which is useless against a process
# looping every few seconds: it reached 1.6G BETWEEN rotations. Size is the
# bound that actually holds, so this adds one.
/var/log/syslog {
    size 100M
    rotate 3
    compress
    missingok
    notifempty
    delaycompress
    sharedscripts
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate 2>/dev/null || true
    endscript
}
