# Cap the systemd journal on the Tick Avenger VM.
#
# It had grown to 956M with no bound, on a 9.7G disk that filled completely on
# 20 Nov 2026 and stopped the account trading -- see
# deploy/tickaverager-logcaps.conf for the full measurement.
#
# journald's default is 10% of the filesystem, which on this box is ~970M and
# is exactly what it reached. 200M is ample for a machine whose real record is
# the trade journal, not the syslog, and it is the one bound that applies even
# while a service is crash-looping -- logrotate runs on a timer, journald
# enforces this continuously.
#
# Install: /etc/systemd/journald.conf.d/tickaverager.conf, then
#   systemctl restart systemd-journald

[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=2week
